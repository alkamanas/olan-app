# docs.olan.app (TLS ends at Traefik; this container speaks plain HTTP on port 80).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    charset utf-8;
    charset_types text/plain text/css application/xml text/xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/xml text/xml image/svg+xml application/javascript application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    # Fingerprinted stylesheet (style.<hash>.css): cache forever.
    location ~* ^/style\.[0-9a-f]+\.css$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Pages: always revalidate so a redeploy shows up immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
